<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pertanyaan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f0f0f0;
      flex-direction: column;
    }

    h1 {
      margin-bottom: 30px;
    }

    .btn-container {
      position: relative;
      width: 300px;
      height: 200px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      position: absolute;
      transition: all 0.3s ease;
    }

    #yesBtn {
      background-color: #4CAF50;
      color: white;
      left: 50px;
      top: 80px;
    }

    #noBtn {
      background-color: #f44336;
      color: white;
      left: 180px;
      top: 80px;
    }
  </style>
</head>
<body>
  <h1>Mau jadi pacarku? 😄</h1>

  <div class="btn-container">
    <button id="yesBtn">Ya</button>
    <button id="noBtn">Tidak</button>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const container = document.querySelector(".btn-container");

    let scale = 1;

    noBtn.addEventListener("mouseover", () => {
      const maxX = container.clientWidth - noBtn.clientWidth;
      const maxY = container.clientHeight - noBtn.clientHeight;

      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      noBtn.style.left = randomX + "px";
      noBtn.style.top = randomY + "px";

      // Membesarkan tombol YES
      scale += 0.3;
      yesBtn.style.transform = `scale(${scale})`;
    });

    noBtn.addEventListener("click", () => {
  // Pindah posisi juga biar tetap "ngeselin"
  const maxX = container.clientWidth - noBtn.clientWidth;
  const maxY = container.clientHeight - noBtn.clientHeight;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  noBtn.style.left = randomX + "px";
  noBtn.style.top = randomY + "px";

  // Membesarkan tombol NO
  scale += 0.3;
  noBtn.style.transform = `scale(${scale})`;
});

    yesBtn.addEventListener("click", () => {
      window.location.href = "success.html";
    });
  </script>
</body>
</html>
